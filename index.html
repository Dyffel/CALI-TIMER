<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c0d"><title>CALI TIMER</title><style>
:root{--lime:#d6ff45;--cyan:#36e6df;--bg:#080c0d;--panel:#141b1d;--line:#2b3536;--text:#f5faf8;--muted:#9aa9a9}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 10%,#caff291b,transparent 45%),radial-gradient(ellipse at 90% 85%,#29ffb60d,transparent 45%)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:550px;margin:auto;min-height:100dvh;padding:calc(22px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom));position:relative}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:31px;line-height:.95;font-weight:1000;letter-spacing:-1.5px}.brand em{font-style:normal;color:var(--lime)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-top:9px}.muted{color:var(--muted)}h1{font-size:28px;line-height:1.1;margin:8px 0 22px}h2{font-size:18px;margin:22px 0 12px}h3{margin:0 0 10px;font-size:16px}.btn{border:1px solid var(--line);background:#1a2324;color:var(--text);border-radius:15px;min-height:48px;padding:12px 16px;font-weight:750}.btn.primary{background:var(--lime);color:#101510;border-color:var(--lime);box-shadow:0 0 20px #d6ff4525}.btn.cyan{background:var(--cyan);color:#061716;border-color:var(--cyan)}.btn.ghost{background:transparent}.btn.full{width:100%}.stack{display:grid;gap:11px}.hero{margin:36px 0 25px}.hero .brand{font-size:57px;line-height:.88}.hero .eyebrow{margin:18px 0 34px}.home-actions .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}.home-actions .btn:first-child{min-height:65px;font-size:18px}.panel{background:linear-gradient(145deg,#172021,#101617);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}.panel.active{border-color:var(--lime)}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row.wrap{flex-wrap:wrap}.label{font-size:12px;color:var(--muted);margin-bottom:6px}input,select,textarea{background:#0b1112;color:var(--text);border:1px solid #344142;border-radius:11px;padding:11px;width:100%;min-width:0}textarea{min-height:120px}input[type=number]{text-align:center}.field{margin:10px 0}.small{font-size:12px}.pill{border-radius:100px;background:#202b29;padding:5px 9px;font-size:11px;color:var(--lime);font-weight:800}.mini{border:1px solid #334141;background:#1c2829;color:var(--text);border-radius:9px;padding:8px 10px;min-height:35px}.setrow{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;align-items:center;margin:7px 0}.setrow input{padding:9px 4px}.sethead{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;text-align:center;font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1112f7;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;gap:4px;place-items:center}.bottom button.on{color:var(--lime)}.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.timer-screen{text-align:center;min-height:70dvh;display:flex;flex-direction:column;justify-content:center}.ring{width:min(80vw,340px);aspect-ratio:1;margin:25px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime) var(--pct),#263032 0);padding:12px;box-shadow:0 0 35px #d6ff4512}.ring.rest{background:conic-gradient(var(--cyan) var(--pct),#263032 0);box-shadow:0 0 35px #36e6df20}.ring-inner{background:#090f10;border-radius:50%;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.clock{font-size:clamp(56px,16vw,85px);font-weight:900;letter-spacing:-4px;font-variant-numeric:tabular-nums}.mode{font-weight:850;color:var(--lime);letter-spacing:2px}.rest .mode{color:var(--cyan)}.timer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none!important}.line{height:1px;background:var(--line);margin:15px 0}.spacer{height:10px}
</style></head><body><main class="app"><div id="screen"></div></main><nav class="bottom" id="nav"></nav><script>
const KEY='cali-timer-programs-v1',HKEY='cali-timer-history-v1';
const icon=(name)=>({home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',programs:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3M8 16l-3 3"/>'}[name]);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let programs=load(KEY),history=load(HKEY),page='home',draft=null,session=null,tick=null;
const fresh=()=>({id:crypto.randomUUID(),name:'New Program',description:'',exercises:[{name:'Front Lever Attempts',mode:'timer',sets:[{work:10,rest:90},{work:10,rest:120},{work:10,rest:0}],between:180}]});
function nav(){ $('#nav').classList.toggle('hide',page==='timer');$('#nav').innerHTML=['home','programs','history','settings'].map(n=>`<button class="${page===n?'on':''}" onclick="go('${n}')"><svg viewBox="0 0 24 24">${icon(n)}</svg>${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}
function go(p){clearInterval(tick);tick=null;page=p;render();window.scrollTo(0,0)}
function render(){nav();const s=$('#screen');if(page==='home')s.innerHTML=`<div class="hero"><div class="brand">CALI<br><em>TIMER</em></div><div class="eyebrow">PLAN. TRAIN. PROGRESS.</div></div><div class="stack home-actions"><button class="btn primary" onclick="go('programs')">START WORKOUT <span>→</span></button><button class="btn" onclick="go('programs')">MY PROGRAMS <span>→</span></button><button class="btn" onclick="editNew()">CREATE PROGRAM <span>＋</span></button><button class="btn" onclick="quick()">QUICK TIMER <span>→</span></button></div><h2>RECENT PROGRAMS</h2>${programs.slice(-2).reverse().map(p=>card(p)).join('')||'<p class="muted">Create your first workout to get started.</p>'}`;
else if(page==='programs')s.innerHTML=`<div class="top"><h1>My Programs</h1><button class="btn primary" onclick="editNew()">＋ New</button></div>${programs.length?programs.map(card).join(''):'<div class="panel muted">No saved programs yet. Create one to begin.</div>'}<div class="actions"><button class="btn" onclick="importText()">PASTE PROGRAM</button><button class="btn" onclick="importFile()">IMPORT BACKUP</button></div>`;
else if(page==='builder')builder();else if(page==='timer')timerView();else if(page==='history')s.innerHTML=`<h1>Workout History</h1>${history.slice().reverse().map(h=>`<div class="panel"><strong>${esc(h.name)}</strong><div class="muted small">${new Date(h.date).toLocaleString()} · ${Math.round(h.seconds/60)} min</div></div>`).join('')||'<p class="muted">Completed sessions will appear here.</p>'}`;
else if(page==='settings')s.innerHTML=`<h1>Settings & Backup</h1><div class="panel"><h3>Your data stays on this device</h3><p class="muted">Export a backup to keep your programs safe or transfer them to another phone. Clearing browser storage can delete saved programs.</p><button class="btn primary full" onclick="exportFile()">EXPORT BACKUP</button><div class="spacer"></div><button class="btn full" onclick="importFile()">IMPORT BACKUP</button></div><div class="panel small muted">Audio cues are best-effort on mobile browsers. Keep this page open and your screen awake for reliable alerts.</div>`}
function card(p){return `<div class="panel"><div class="row"><div><strong>${esc(p.name)}</strong><div class="muted small">${p.exercises.length} exercises · ${p.exercises.reduce((a,e)=>a+e.sets.length,0)} sets · ~${Math.ceil(total(p)/60)} min</div></div><button class="btn primary" onclick="start('${p.id}')">START</button></div><div class="actions" style="margin-top:12px"><button class="mini" onclick="edit('${p.id}')">EDIT</button><button class="mini" onclick="duplicate('${p.id}')">DUPLICATE</button><button class="mini" onclick="removeProgram('${p.id}')">DELETE</button></div></div>`}
function total(p){return p.exercises.reduce((sum,e,i)=>sum+e.sets.reduce((n,set,j)=>n+(e.mode==='manual'?0:Number(set.work))+(j===e.sets.length-1?0:Number(set.rest)),0)+(i<p.exercises.length-1?Number(e.between):0),0)}
function editNew(){draft=fresh();go('builder')}function edit(id){draft=structuredClone(programs.find(p=>p.id===id));go('builder')}function duplicate(id){draft=structuredClone(programs.find(p=>p.id===id));draft.id=crypto.randomUUID();draft.name+=' (Copy)';go('builder')}
function removeProgram(id){if(confirm('Delete this program?')){programs=programs.filter(p=>p.id!==id);save(KEY,programs);render()}}
function builder(){const s=$('#screen');s.innerHTML=`<div class="top"><button class="btn ghost" onclick="go('programs')">← Back</button><strong>Workout Builder</strong><button class="btn primary" onclick="saveDraft()">SAVE</button></div><div class="panel"><div class="label">PROGRAM NAME</div><input id="pname" value="${esc(draft.name)}" oninput="draft.name=this.value"><div class="label" style="margin-top:12px">DESCRIPTION (OPTIONAL)</div><input value="${esc(draft.description)}" oninput="draft.description=this.value"><p class="muted small">${draft.exercises.length} exercises · ~${Math.ceil(total(draft)/60)} min estimated (manual sets excluded)</p></div><div class="row"><h2>Exercises</h2><button class="btn primary" onclick="addExercise()">＋ Add</button></div>${draft.exercises.map((e,i)=>`<div class="panel"><div class="row"><strong>${String(i+1).padStart(2,'0')} · EXERCISE</strong><div><button class="mini" onclick="moveExercise(${i},-1)">↑</button> <button class="mini" onclick="moveExercise(${i},1)">↓</button> <button class="mini" onclick="deleteExercise(${i})">×</button></div></div><div class="field"><input aria-label="Exercise name" value="${esc(e.name)}" oninput="draft.exercises[${i}].name=this.value"></div><div class="field"><div class="label">SET MODE</div><select onchange="draft.exercises[${i}].mode=this.value;render()"><option value="timer" ${e.mode==='timer'?'selected':''}>Timed countdown</option><option value="manual" ${e.mode==='manual'?'selected':''}>Manual — press DONE</option></select></div><div class="sethead"><span>SET</span><span>${e.mode==='manual'?'TARGET (sec, optional)':'WORK (sec)'}</span><span>REST (sec)</span><span></span></div>${e.sets.map((set,j)=>`<div class="setrow"><strong>${j+1}</strong><input type="number" min="0" inputmode="numeric" value="${set.work}" onchange="setValue(${i},${j},'work',this.value)"><input type="number" min="0" inputmode="numeric" value="${set.rest}" ${j===e.sets.length-1?'disabled title="Use rest before next exercise"':''} onchange="setValue(${i},${j},'rest',this.value)"><button class="mini" onclick="deleteSet(${i},${j})">×</button></div>`).join('')}<button class="mini" onclick="addSet(${i})">＋ ADD SET</button><div class="line"></div><div class="row"><span class="small">REST BEFORE NEXT EXERCISE (sec)</span><input aria-label="Rest before next exercise" style="width:100px" type="number" min="0" value="${e.between}" onchange="draft.exercises[${i}].between=Math.max(0,+this.value||0)"></div></div>`).join('')}<button class="btn full" onclick="addExercise()">＋ ADD EXERCISE</button><div class="spacer"></div><button class="btn primary full" onclick="saveDraft()">SAVE PROGRAM</button>`}
function setValue(i,j,k,v){draft.exercises[i].sets[j][k]=Math.max(0,+v||0)}
function addExercise(){draft.exercises.push({name:'New Exercise',mode:'timer',sets:[{work:20,rest:90},{work:20,rest:0}],between:180});render()}
function deleteExercise(i){if(draft.exercises.length===1)return alert('Keep at least one exercise.');draft.exercises.splice(i,1);render()}
function moveExercise(i,d){let j=i+d;if(j<0||j>=draft.exercises.length)return;[draft.exercises[i],draft.exercises[j]]=[draft.exercises[j],draft.exercises[i]];render()}
function addSet(i){let a=draft.exercises[i].sets;a.push({work:a.at(-1)?.work||20,rest:0});render()}
function deleteSet(i,j){let a=draft.exercises[i].sets;if(a.length<2)return alert('Keep at least one set.');a.splice(j,1);render()}
function saveDraft(){draft.name=draft.name.trim()||'Untitled Workout';if(draft.exercises.some(e=>!e.name.trim()||!e.sets.length))return alert('Name each exercise and include at least one set.');let idx=programs.findIndex(p=>p.id===draft.id);if(idx<0)programs.push(structuredClone(draft));else programs[idx]=structuredClone(draft);save(KEY,programs);go('programs')}
function plan(p){let seq=[];p.exercises.forEach((e,i)=>{e.sets.forEach((set,j)=>{seq.push({type:'work',name:e.name,set:j+1,sets:e.sets.length,seconds:e.mode==='manual'?0:Math.max(0,+set.work),manual:e.mode==='manual'});if(j<e.sets.length-1&&+set.rest>0)seq.push({type:'rest',name:e.name,seconds:+set.rest,next:`${e.name} · Set ${j+2}`})});if(i<p.exercises.length-1&&+e.between>0)seq.push({type:'rest',name:'Between exercises',seconds:+e.between,next:p.exercises[i+1].name})});return seq}
function start(id){let p=programs.find(x=>x.id===id);launch(p)}
function quick(){let sec=prompt('Countdown duration in seconds (e.g. 90):','60');if(sec===null)return;sec=Number(sec);if(!Number.isFinite(sec)||sec<1||sec>86400)return alert('Enter 1–86400 seconds.');launch({name:'Quick Timer',exercises:[{name:'Countdown',mode:'timer',sets:[{work:sec,rest:0}],between:0}]})}
function launch(p){clearInterval(tick);session={name:p.name,seq:plan(p),index:0,remaining:0,deadline:0,paused:true,started:Date.now(),finished:false};page='timer';activate(0);render();resume()}
function activate(i){session.index=i;let item=session.seq[i];if(!item){complete();return}session.remaining=item.seconds*1000;session.paused=true;session.deadline=0}
function resume(){if(!session||session.finished)return;if(session.paused){session.paused=false;session.deadline=Date.now()+session.remaining;tick=setInterval(update,120)}else{session.remaining=Math.max(0,session.deadline-Date.now());session.paused=true;clearInterval(tick)}timerView()}
function update(){if(!session||session.paused)return;session.remaining=Math.max(0,session.deadline-Date.now());if(session.remaining===0&&!session.seq[session.index].manual){nextPhase();return}timerDigits()}
function nextPhase(){beep();activate(session.index+1);if(!session.finished){session.paused=false;session.deadline=Date.now()+session.remaining;timerView();if(session.remaining===0&&!session.seq[session.index].manual)update()}}
function complete(){clearInterval(tick);session.finished=true;history.push({name:session.name,date:new Date().toISOString(),seconds:Math.round((Date.now()-session.started)/1000)});save(HKEY,history);$('#screen').innerHTML=`<div class="timer-screen"><h1>SESSION COMPLETE</h1><p class="muted">${esc(session.name)}</p><button class="btn primary" onclick="go('home')">BACK HOME</button></div>`}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=850;g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.start();o.stop(a.currentTime+.16);setTimeout(()=>a.close(),400)}catch{}}
const fmt=ms=>{let n=Math.ceil(Math.max(0,ms)/1000);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
function timerView(){if(!session||session.finished)return;const item=session.seq[session.index],rest=item.type==='rest';$('#screen').innerHTML=`<div class="top"><button class="btn ghost" onclick="quit()">← Exit</button><strong>${esc(session.name)}</strong><span>${session.index+1}/${session.seq.length}</span></div><div class="timer-screen"><h1>${rest?'RECOVERY':esc(item.name)}</h1><div class="muted">${rest?`Next: ${esc(item.next)}`:`SET ${item.set} / ${item.sets}`}</div><div class="ring ${rest?'rest':''}" id="ring" style="--pct:100%"><div class="ring-inner"><div class="clock" id="digits">00:00</div><div class="mode">${rest?'REST':item.manual?'MANUAL SET':'WORK'}</div></div></div><p class="muted" id="next">${session.seq[session.index+1]?`NEXT: ${session.seq[session.index+1].type==='rest'?'REST':'WORK'} · ${fmt(session.seq[session.index+1].seconds*1000)}`:'FINAL SET'}</p><div class="timer-buttons"><button class="btn" onclick="resume()" id="pause">${session.paused?'RESUME':'PAUSE'}</button><button class="btn ${rest?'cyan':'primary'}" onclick="nextPhase()">${rest?'SKIP REST':item.manual?'DONE SET':'DONE EARLY'}</button></div><div class="actions" style="margin-top:12px"><button class="mini" onclick="adjust(-10)">−10 SEC</button><button class="mini" onclick="adjust(10)">+10 SEC</button></div></div>`;timerDigits()}
function timerDigits(){if(!session||session.finished)return;let item=session.seq[session.index],el=$('#digits');if(!el)return;el.textContent=item.manual?'DONE?':fmt(session.remaining);let max=item.seconds*1000;$('#ring').style.setProperty('--pct',`${max?Math.min(100,Math.max(0,session.remaining/max*100)):100}%`);$('#pause').textContent=session.paused?'RESUME':'PAUSE'}
function adjust(sec){session.remaining=Math.max(0,session.remaining+sec*1000);if(!session.paused)session.deadline=Date.now()+session.remaining;timerDigits()}
function quit(){if(confirm('End this workout?')){clearInterval(tick);session=null;go('home')}}
function exportFile(){const blob=new Blob([JSON.stringify({version:1,programs,history},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cali-timer-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{let obj=JSON.parse(await inp.files[0].text());if(!Array.isArray(obj.programs)||!obj.programs.every(p=>typeof p.name==='string'&&Array.isArray(p.exercises)&&p.exercises.every(e=>typeof e.name==='string'&&Array.isArray(e.sets))))throw Error('Invalid backup');if(!confirm('Import these programs? Existing programs with different IDs will be kept.'))return;let ids=new Set(programs.map(p=>p.id));for(let p of obj.programs){if(!ids.has(p.id)){programs.push(p);ids.add(p.id)}}save(KEY,programs);render();alert('Backup imported.')}catch(e){alert('Could not import: '+e.message)}};inp.click()}
function importText(){let raw=prompt('Paste a program in this format:\\nWorkout: Front Lever Day\\nFront Lever | 10s/90s, 10s/120s, 10s | next 180s\\nPlanche | 20s/180s, 20s/180s, 20s');if(!raw)return;let lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean),name='Imported Workout';if(/^workout\s*:/i.test(lines[0]))name=lines.shift().split(':').slice(1).join(':').trim();let exercises=[];for(let line of lines){let parts=line.split('|');if(parts.length<2)return alert('Use: Exercise | 10s/90s, 10s/120s, 10s | next 180s');let sets=parts[1].split(',').map(t=>{let m=t.trim().match(/^(\d+)\s*s?(?:\s*\/\s*(\d+)\s*s?)?$/i);return m?{work:+m[1],rest:+(m[2]||0)}:null});if(sets.some(x=>!x))return alert('Check the set format for '+parts[0]);let between=+(parts[2]||'').match(/\d+/)?.[0]||0;exercises.push({name:parts[0].trim(),mode:'timer',sets,between})}if(!exercises.length)return;draft={id:crypto.randomUUID(),name,description:'',exercises};go('builder')}
render();
</script></body></html>
